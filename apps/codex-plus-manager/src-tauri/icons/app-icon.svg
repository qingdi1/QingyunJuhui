<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="seal-shadow" x="-18%" y="-18%" width="136%" height="148%">
      <feDropShadow dx="0" dy="15" stdDeviation="13" flood-color="#2d1711" flood-opacity=".42"/>
    </filter>
  </defs>

  <!-- The application icon is the sidebar brand seal at display scale. -->
  <g filter="url(#seal-shadow)">
    <rect x="42" y="36" width="428" height="428" rx="50" fill="#762b23"/>
    <rect x="42" y="36" width="428" height="414" rx="50" fill="#b34032" stroke="#812e25" stroke-width="10"/>

    <!-- Restrained bevels reproduce the inset and top highlight of .brand-mark. -->
    <path d="M91 60h326c17 0 29 4 39 13" fill="none" stroke="#d76b5a" stroke-width="10" stroke-linecap="round" opacity=".72"/>
    <path d="M66 393v8c0 18 14 32 32 32h316c18 0 32-14 32-32v-13" fill="none" stroke="#6d281f" stroke-width="15" stroke-linecap="round" opacity=".55"/>

    <!-- Two warm parchment lines form the traditional seal border. -->
    <rect x="69" y="63" width="374" height="360" rx="33" fill="none" stroke="#fff2c8" stroke-width="12"/>
    <rect x="88" y="82" width="336" height="322" rx="22" fill="none" stroke="#e8c98f" stroke-width="5" opacity=".9"/>

    <!-- Path-based 青 glyph, deliberately bold for 16 px taskbar rendering. -->
    <g fill="#fff0c1">
      <rect x="151" y="123" width="210" height="27" rx="9"/>
      <rect x="173" y="173" width="166" height="27" rx="9"/>
      <rect x="137" y="224" width="238" height="29" rx="10"/>
      <rect x="242" y="105" width="28" height="150" rx="10"/>
      <path d="M169 280c0-11 9-20 20-20h134c11 0 20 9 20 20v116c0 17-13 29-30 29h-35v-28h25c7 0 11-4 11-11v-15H198v54h-29zm29 8v21h116v-21zm0 45v21h116v-21z"/>
    </g>

    <path d="M91 91c10-10 21-16 34-19" fill="none" stroke="#fff8da" stroke-width="8" stroke-linecap="round" opacity=".8"/>
  </g>
</svg>
